<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🌀 GALAXY GENERATOR</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #05050a;
            overflow: hidden;
            font-family: 'Segoe UI', sans-serif;
            color: #fff;
        }
        canvas {
            display: block;
        }
        #info {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(10, 10, 30, 0.7);
            backdrop-filter: blur(8px);
            padding: 12px 28px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 0.9rem;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.5);
            text-align: center;
            pointer-events: none;
            user-select: none;
            box-shadow: 0 0 40px rgba(0, 200, 255, 0.05);
        }
        #info span {
            color: #66d9ff;
            font-weight: 600;
        }
        @media (max-width: 600px) {
            #info {
                font-size: 0.7rem;
                padding: 8px 16px;
                bottom: 16px;
                max-width: 90%;
            }
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div id="info">🌀 drag to orbit · <span>scroll</span> to zoom · <span>hover</span> to warp</div>

    <script>
        // ─── SETUP ───
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let W, H;
        function resize() {
            W = canvas.width = window.innerWidth;
            H = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // ─── MOUSE / TOUCH ───
        let mouseX = 0.5,
            mouseY = 0.5;
        let targetRotX = 0.3,
            targetRotY = 0.2;
        let rotX = 0.3,
            rotY = 0.2;
        let zoom = 1.0;
        let targetZoom = 1.0;

        canvas.addEventListener('mousemove', (e) => {
            mouseX = e.clientX / W;
            mouseY = e.clientY / H;
            // map mouse to rotation offsets
            targetRotX = 0.5 + (mouseY - 0.5) * 2.5;
            targetRotY = 0.5 + (mouseX - 0.5) * 4.0;
        });

        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            targetZoom = Math.min(2.0, Math.max(0.4, targetZoom - e.deltaY * 0.001));
        });

        // touch support
        let touchStartX = 0,
            touchStartY = 0;
        canvas.addEventListener('touchstart', (e) => {
            const t = e.touches[0];
            touchStartX = t.clientX / W;
            touchStartY = t.clientY / H;
        });
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const t = e.touches[0];
            const dx = t.clientX / W - touchStartX;
            const dy = t.clientY / H - touchStartY;
            targetRotX += dy * 2.0;
            targetRotY += dx * 2.0;
            touchStartX = t.clientX / W;
            touchStartY = t.clientY / H;
        });

        // ─── STAR SYSTEM ───
        const STAR_COUNT = 3800;
        const ARM_COUNT = 5;
        const SPIRAL_TIGHTNESS = 1.8;
        const STAR_RADIUS = 1.2; // max radius in world coords

        // Pre-calculate star data
        const stars = [];
        for (let i = 0; i < STAR_COUNT; i++) {
            // Spiral arm distribution
            const armIndex = Math.floor(Math.random() * ARM_COUNT);
            const armAngleOffset = (armIndex / ARM_COUNT) * Math.PI * 2;

            // Radius with higher density near center
            const r = Math.pow(Math.random(), 1.2) * STAR_RADIUS;

            // Spiral angle: radius * tightness + arm offset + random scatter
            const scatter = (Math.random() - 0.5) * 0.6;
            const angle = r * SPIRAL_TIGHTNESS + armAngleOffset + scatter;

            // Slight vertical wobble (flattened disc)
            const z = (Math.random() - 0.5) * 0.15 * (1 - r / STAR_RADIUS * 0.5);

            // Color based on radius (inner = warm, outer = cool)
            const t = r / STAR_RADIUS;
            const rCol = 1.0 - t * 0.5;
            const gCol = 0.7 + Math.sin(t * 10) * 0.2;
            const bCol = 0.4 + t * 0.6;

            // Size: bigger near center, smaller outside
            const size = (0.8 + Math.random() * 1.4) * (1.2 - t * 0.6);

            // Random twinkle speed and phase
            const twinkleSpeed = 0.5 + Math.random() * 2.0;
            const twinklePhase = Math.random() * Math.PI * 2;

            stars.push({
                x: Math.cos(angle) * r,
                z: Math.sin(angle) * r,
                y: z,
                r: rCol,
                g: gCol,
                b: bCol,
                size: size,
                twinkleSpeed: twinkleSpeed,
                twinklePhase: twinklePhase,
                // store for glow effect
            });
        }

        // Add a few random "background" stars (tiny, static)
        const BG_STARS = 800;
        const bgStars = [];
        for (let i = 0; i < BG_STARS; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const r = 3.5 + Math.random() * 6;
            bgStars.push({
                x: Math.sin(phi) * Math.cos(theta) * r,
                y: Math.sin(phi) * Math.sin(theta) * r,
                z: Math.cos(phi) * r,
                size: 0.3 + Math.random() * 0.6,
                brightness: 0.3 + Math.random() * 0.7,
            });
        }

        // ─── RENDERING ───
        function render(time) {
            // Smooth interpolation
            rotX += (targetRotX - rotX) * 0.06;
            rotY += (targetRotY - rotY) * 0.06;
            zoom += (targetZoom - zoom) * 0.08;

            // Clear with subtle starfield background (gradient)
            const grad = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, W * 0.8);
            grad.addColorStop(0, '#0a0a1a');
            grad.addColorStop(0.6, '#05050f');
            grad.addColorStop(1, '#020208');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, W, H);

            // ── Projection ──
            const cosX = Math.cos(rotX);
            const sinX = Math.sin(rotX);
            const cosY = Math.cos(rotY);
            const sinY = Math.sin(rotY);

            function project(pX, pY, pZ) {
                // Rotate around X axis
                let y1 = pY * cosX - pZ * sinX;
                let z1 = pY * sinX + pZ * cosX;
                // Rotate around Y axis
                let x2 = pX * cosY + z1 * sinY;
                let z2 = -pX * sinY + z1 * cosY;

                // Perspective projection
                const fov = 1.8;
                const scale = fov / (z2 + 3.5) * zoom;
                const screenX = W / 2 + x2 * scale * W * 0.35;
                const screenY = H / 2 - y1 * scale * W * 0.35;
                return { x: screenX, y: screenY, depth: z2, scale: scale };
            }

            // ── Draw background stars ──
            ctx.fillStyle = 'rgba(255,255,255,0.3)';
            for (const star of bgStars) {
                const p = project(star.x, star.y, star.z);
                // only if in front of camera
                if (p.depth > -2) {
                    const brightness = star.brightness * (0.6 + 0.4 * Math.sin(time * 0.0003 + star.x));
                    const size = star.size * p.scale * 0.6;
                    ctx.globalAlpha = brightness * 0.5;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, Math.max(0.2, size), 0, Math.PI * 2);
                    ctx.fill();
                }
            }
            ctx.globalAlpha = 1;

            // ── Sort main stars by depth for painter's algorithm ──
            const projected = stars.map((star) => {
                const p = project(star.x, star.y, star.z);
                return { ...star, proj: p };
            });
            projected.sort((a, b) => b.proj.depth - a.proj.depth);

            // ── Draw main stars ──
            for (const star of projected) {
                const p = star.proj;
                if (p.depth < -1.5) continue; // behind camera

                // Twinkle
                const twinkle = 0.7 + 0.3 * Math.sin(time * 0.001 * star.twinkleSpeed + star.twinklePhase);
                const baseSize = star.size * p.scale * 0.7 * zoom;
                const size = baseSize * (0.6 + 0.4 * twinkle);

                // Color with slight bloom
                const r = star.r * (0.8 + 0.2 * twinkle);
                const g = star.g * (0.7 + 0.3 * twinkle);
                const b = star.b * (0.6 + 0.4 * twinkle);

                // Glow (multiple layers)
                const glowSize = size * 2.5;
                const gradient = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, glowSize);
                gradient.addColorStop(0, `rgba(${r*255|0},${g*255|0},${b*255|0},${0.8 * twinkle})`);
                gradient.addColorStop(0.2, `rgba(${r*255|0},${g*255|0},${b*255|0},${0.4 * twinkle})`);
                gradient.addColorStop(1, `rgba(${r*255|0},${g*255|0},${b*255|0},0)`);
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(p.x, p.y, glowSize, 0, Math.PI * 2);
                ctx.fill();

                // Core
                ctx.fillStyle = `rgba(${255},${255},${255},${0.9 * twinkle})`;
                ctx.beginPath();
                ctx.arc(p.x, p.y, Math.max(0.4, size * 0.5), 0, Math.PI * 2);
                ctx.fill();

                // Inner color core
                ctx.fillStyle = `rgba(${r*255|0},${g*255|0},${b*255|0},${0.7 * twinkle})`;
                ctx.beginPath();
                ctx.arc(p.x, p.y, Math.max(0.2, size * 0.25), 0, Math.PI * 2);
                ctx.fill();
            }

            // ── Draw a faint central glow ──
            const centerGlow = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, W * 0.15);
            centerGlow.addColorStop(0, 'rgba(255,200,150,0.08)');
            centerGlow.addColorStop(0.5, 'rgba(150,100,255,0.04)');
            centerGlow.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = centerGlow;
            ctx.fillRect(0, 0, W, H);

            // ── Dynamic connecting lines (just for style) ──
            // draw a few random web lines between nearby stars (very subtle)
            ctx.strokeStyle = 'rgba(100,180,255,0.02)';
            ctx.lineWidth = 0.5;
            const sampleCount = 120;
            for (let i = 0; i < sampleCount; i++) {
                const a = projected[Math.floor(Math.random() * projected.length)];
                const b = projected[Math.floor(Math.random() * projected.length)];
                if (!a || !b) continue;
                const dx = a.proj.x - b.proj.x;
                const dy = a.proj.y - b.proj.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < 60 && dist > 10) {
                    const alpha = 0.04 * (1 - dist / 60);
                    ctx.strokeStyle = `rgba(100,200,255,${alpha})`;
                    ctx.beginPath();
                    ctx.moveTo(a.proj.x, a.proj.y);
                    ctx.lineTo(b.proj.x, b.proj.y);
                    ctx.stroke();
                }
            }

            // ── Lens flare / light leak (just for vibe) ──
            const flareX = W * 0.3 + Math.sin(time * 0.0001) * W * 0.2;
            const flareY = H * 0.2 + Math.cos(time * 0.00015) * H * 0.15;
            const flare = ctx.createRadialGradient(flareX, flareY, 0, flareX, flareY, W * 0.6);
            flare.addColorStop(0, 'rgba(180,220,255,0.015)');
            flare.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = flare;
            ctx.fillRect(0, 0, W, H);

            requestAnimationFrame(render);
        }

        // ─── START ───
        requestAnimationFrame(render);

        // ─── Prevent context menu on canvas ───
        canvas.addEventListener('contextmenu', (e) => e.preventDefault());
    </script>
</body>
</html>
