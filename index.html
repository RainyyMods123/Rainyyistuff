<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PlayFab Session Ticket Grabber</title>
<style>
  :root {
    --bg: #1e1f22;
    --panel: #2a2b2e;
    --accent: #7b6cf6;
    --accent-hover: #6a5ce0;
    --text: #e6e6e6;
    --muted: #9a9a9a;
    --border: #3a3b3e;
    --success: #3fbf60;
    --error: #e5533d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 32px 16px;
    display: flex;
    justify-content: center;
  }
  .card {
    width: 100%;
    max-width: 520px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px;
  }
  h1 {
    font-size: 18px;
    margin: 0 0 4px;
  }
  p.sub {
    color: var(--muted);
    font-size: 13px;
    margin: 0 0 24px;
  }
  label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 6px;
    margin-top: 16px;
  }
  input[type="text"] {
    width: 100%;
    padding: 10px 12px;
    background: #232427;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 14px;
    outline: none;
  }
  input[type="text"]:focus {
    border-color: var(--accent);
  }
  .checkbox-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 16px;
  }
  .checkbox-row input { width: 16px; height: 16px; }
  .checkbox-row label { margin: 0; color: var(--text); font-size: 13px; }
  button {
    width: 100%;
    margin-top: 22px;
    padding: 12px;
    background: var(--accent);
    border: none;
    border-radius: 8px;
    color: white;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
  }
  button:hover { background: var(--accent-hover); }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  .result {
    margin-top: 24px;
    display: none;
  }
  .result.show { display: block; }
  .field {
    background: #232427;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 10px;
  }
  .field-label {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 6px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .copy-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 6px;
    width: auto;
    margin: 0;
  }
  .copy-btn:hover {
    background: var(--border);
    color: var(--text);
  }
  .field-value {
    font-family: "SF Mono", Monaco, "Courier New", monospace;
    font-size: 12px;
    word-break: break-all;
    color: var(--text);
    line-height: 1.4;
  }
  .status {
    margin-top: 16px;
    font-size: 13px;
    padding: 10px 12px;
    border-radius: 8px;
    display: none;
  }
  .status.show { display: block; }
  .status.ok { background: rgba(63,191,96,0.12); color: var(--success); border: 1px solid rgba(63,191,96,0.3); }
  .status.err { background: rgba(229,83,61,0.12); color: var(--error); border: 1px solid rgba(229,83,61,0.3); }
  .badge {
    display: inline-block;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 999px;
    background: rgba(123,108,246,0.15);
    color: var(--accent);
    margin-left: 6px;
  }
</style>
</head>
<body>
<div class="card">
  <h1>PlayFab Session Ticket Grabber</h1>
  <p class="sub">Logs in via <code>LoginWithCustomID</code> and returns the PlayFabId + SessionTicket you need for authenticated calls like ExecuteCloudScript.</p>

  <label for="titleId">Title ID</label>
  <input type="text" id="titleId" placeholder="e.g. 1757B0" autocomplete="off" />

  <label for="customId">Custom ID</label>
  <input type="text" id="customId" placeholder="e.g. test123" autocomplete="off" />

  <div class="checkbox-row">
    <input type="checkbox" id="createAccount" checked />
    <label for="createAccount">Create account if it doesn't exist</label>
  </div>

  <button id="loginBtn">Get Session Ticket</button>

  <div class="status" id="status"></div>

  <div class="result" id="result">
    <div class="field">
      <div class="field-label">
        PlayFabId <span><button class="copy-btn" data-copy="playFabId">Copy</button></span>
      </div>
      <div class="field-value" id="playFabId">—</div>
    </div>
    <div class="field">
      <div class="field-label">
        Session Ticket <span class="badge" id="newBadge" style="display:none;">New Account</span>
        <span><button class="copy-btn" data-copy="sessionTicket">Copy</button></span>
      </div>
      <div class="field-value" id="sessionTicket">—</div>
    </div>
    <div class="field">
      <div class="field-label">
        Entity Token <span><button class="copy-btn" data-copy="entityToken">Copy</button></span>
      </div>
      <div class="field-value" id="entityToken">—</div>
    </div>
  </div>
</div>

<script>
const loginBtn = document.getElementById('loginBtn');
const statusEl = document.getElementById('status');
const resultEl = document.getElementById('result');

function setStatus(msg, type) {
  statusEl.textContent = msg;
  statusEl.className = 'status show ' + type;
}

function clearStatus() {
  statusEl.className = 'status';
}

loginBtn.addEventListener('click', async () => {
  const titleId = document.getElementById('titleId').value.trim();
  const customId = document.getElementById('customId').value.trim();
  const createAccount = document.getElementById('createAccount').checked;

  if (!titleId || !customId) {
    setStatus('Please enter both a Title ID and a Custom ID.', 'err');
    return;
  }

  loginBtn.disabled = true;
  loginBtn.textContent = 'Logging in...';
  clearStatus();
  resultEl.classList.remove('show');

  try {
    const response = await fetch(`https://${titleId}.playfabapi.com/Client/LoginWithCustomID`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        TitleId: titleId,
        CustomId: customId,
        CreateAccount: createAccount
      })
    });

    const data = await response.json();

    if (data.code === 200 && data.data) {
      document.getElementById('playFabId').textContent = data.data.PlayFabId || '—';
      document.getElementById('sessionTicket').textContent = data.data.SessionTicket || '—';
      document.getElementById('entityToken').textContent =
        (data.data.EntityToken && data.data.EntityToken.EntityToken) || '—';
      document.getElementById('newBadge').style.display = data.data.NewlyCreated ? 'inline-block' : 'none';
      resultEl.classList.add('show');
      setStatus('Logged in successfully.', 'ok');
    } else {
      setStatus(`Error ${data.code || ''}: ${data.errorMessage || data.error || 'Unknown error'}`, 'err');
    }
  } catch (err) {
    setStatus('Request failed: ' + err.message + ' (check the Title ID and your network/CORS settings)', 'err');
  } finally {
    loginBtn.disabled = false;
    loginBtn.textContent = 'Get Session Ticket';
  }
});

document.querySelectorAll('.copy-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const targetId = btn.getAttribute('data-copy');
    const text = document.getElementById(targetId).textContent;
    if (text && text !== '—') {
      navigator.clipboard.writeText(text).then(() => {
        const original = btn.textContent;
        btn.textContent = 'Copied!';
        setTimeout(() => { btn.textContent = original; }, 1200);
      });
    }
  });
});
</script>
</body>
</html>
