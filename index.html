<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Auto‑play Song</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
            background: #0a0a1a;
            color: #fff;
            padding: 2rem;
        }
        .card {
            background: rgba(255,255,255,0.04);
            backdrop-filter: blur(12px);
            padding: 3rem 4rem;
            border-radius: 40px;
            border: 1px solid rgba(255,255,255,0.06);
            text-align: center;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 0 60px rgba(0,150,255,0.05);
        }
        h1 {
            font-size: 2.4rem;
            margin-bottom: 0.5rem;
            letter-spacing: 1px;
        }
        p {
            color: #8899aa;
            margin-bottom: 1.5rem;
            font-size: 1.1rem;
        }
        .btn {
            background: #1a2a4a;
            border: none;
            color: #bbddff;
            padding: 0.8rem 2.2rem;
            border-radius: 60px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .btn:hover {
            background: #2a4a7a;
            transform: scale(1.04);
            box-shadow: 0 0 30px rgba(0,150,255,0.2);
        }
        .status {
            margin-top: 1rem;
            font-size: 0.85rem;
            color: #6688aa;
        }
        .status.playing {
            color: #66ddff;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>🎵 Enjoy the vibe</h1>
        <p>Your song will play automatically.</p>
        <button class="btn" id="playBtn">▶ Play / Resume</button>
        <div class="status" id="statusText">⏳ Loading...</div>
    </div>

    <script>
        // ─── CONFIGURATION ───
        // 1. Place your "Song.mp3" file in the same folder as this HTML.
        // 2. Or change the URL below to a direct MP3 link.
        const SONG_URL = 'Song.mp3'; // <-- change this to your file or URL

        // ─── Create audio element ───
        const audio = new Audio(SONG_URL);
        audio.loop = true;          // keep looping
        audio.volume = 0.8;         // 0.0 – 1.0

        const statusEl = document.getElementById('statusText');
        const playBtn = document.getElementById('playBtn');

        // ─── Try to autoplay ───
        function attemptAutoplay() {
            audio.play()
                .then(() => {
                    statusEl.textContent = '🎶 Playing...';
                    statusEl.className = 'status playing';
                    playBtn.textContent = '⏸ Pause';
                })
                .catch((err) => {
                    // Browsers block autoplay unless user has interacted
                    statusEl.textContent = '🔇 Click "Play" to start (autoplay blocked)';
                    statusEl.className = 'status';
                    console.warn('Autoplay prevented:', err);
                });
        }

        // ─── Play / Pause toggle ───
        playBtn.addEventListener('click', () => {
            if (audio.paused) {
                audio.play()
                    .then(() => {
                        statusEl.textContent = '🎶 Playing...';
                        statusEl.className = 'status playing';
                        playBtn.textContent = '⏸ Pause';
                    })
                    .catch(err => {
                        statusEl.textContent = '❌ Could not play audio';
                        console.error('Play error:', err);
                    });
            } else {
                audio.pause();
                statusEl.textContent = '⏸ Paused';
                statusEl.className = 'status';
                playBtn.textContent = '▶ Play / Resume';
            }
        });

        // ─── When the page loads, try autoplay ───
        window.addEventListener('load', attemptAutoplay);

        // ─── Update status when audio ends (loop disabled) ───
        audio.addEventListener('ended', () => {
            if (!audio.loop) {
                statusEl.textContent = '⏹ Finished';
                statusEl.className = 'status';
                playBtn.textContent = '▶ Play / Resume';
            }
        });

        // ─── Handle errors (e.g., file not found) ───
        audio.addEventListener('error', (e) => {
            statusEl.textContent = '❌ Error: Could not load audio file.';
            statusEl.className = 'status';
            console.error('Audio load error:', e);
        });
    </script>
</body>
</html>
