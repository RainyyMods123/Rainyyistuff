<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RainyyClient · Downloads</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0a14;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            padding: 2rem;
            background-image: radial-gradient(circle at 20% 30%, #1a1040, #0a0a14 70%);
        }

        .container {
            max-width: 700px;
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(16px);
            padding: 3rem 2.5rem;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 0 80px rgba(0, 150, 255, 0.04);
            text-align: center;
        }

        h1 {
            font-size: 2.6rem;
            font-weight: 700;
            background: linear-gradient(135deg, #a855f7, #66d9ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: 1px;
            margin-bottom: 0.3rem;
        }

        .sub {
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.95rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 2.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            padding-bottom: 1.2rem;
        }

        .download-grid {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            align-items: center;
        }

        .download-card {
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 24px;
            padding: 1.8rem 2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            color: inherit;
            display: block;
            position: relative;
            overflow: hidden;
        }

        .download-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(168, 85, 247, 0.05), rgba(102, 217, 255, 0.02));
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .download-card:hover {
            transform: translateY(-4px);
            border-color: rgba(168, 85, 247, 0.25);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
        }

        .download-card:hover::before {
            opacity: 1;
        }

        .download-card .version {
            font-size: 1.8rem;
            font-weight: 700;
            color: #c8d8ff;
            letter-spacing: 1px;
            position: relative;
            z-index: 2;
        }

        .download-card .version span {
            color: #66d9ff;
        }

        .download-card .badge {
            display: inline-block;
            margin-top: 0.4rem;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.04);
            padding: 0.2rem 1rem;
            border-radius: 40px;
            position: relative;
            z-index: 2;
        }

        .download-card .arrow {
            float: right;
            font-size: 1.6rem;
            opacity: 0.2;
            transition: opacity 0.3s, transform 0.3s;
            position: relative;
            z-index: 2;
        }

        .download-card:hover .arrow {
            opacity: 0.6;
            transform: translateX(4px);
        }

        .download-card .file-size {
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.15);
            margin-top: 0.2rem;
            position: relative;
            z-index: 2;
        }

        /* Special style for second card (slightly different tint) */
        .download-card:nth-child(2) {
            border-color: rgba(102, 217, 255, 0.08);
        }
        .download-card:nth-child(2):hover {
            border-color: rgba(102, 217, 255, 0.25);
        }
        .download-card:nth-child(2) .version span {
            color: #a855f7;
        }

        .footer {
            margin-top: 2.2rem;
            font-size: 0.65rem;
            color: rgba(255, 255, 255, 0.06);
            letter-spacing: 2px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 2rem 1.2rem;
            }
            h1 {
                font-size: 2rem;
            }
            .download-card {
                padding: 1.4rem 1.2rem;
            }
            .download-card .version {
                font-size: 1.4rem;
            }
            .download-card .arrow {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>⚡ RainyyClient</h1>
        <div class="sub">Download · Legacy Builds</div>

        <div class="download-grid">
            <!-- ─── DOWNLOAD CARD 1 ─── -->
            <a href="https://cdn.discordapp.com/attachments/1483570077206057161/1483573569131909192/libAK.so?ex=6a9150ce&is=6a8fff4e&hm=024c96837ffabf8c2437926c8404b67d228091f9130ab2ebd03ca4c67d102c40&" download class="download-card">
                <span class="version">AK client <span>2021.3</span></span>
                <span class="arrow">⬇</span>
                <div class="badge">stable</div>
            </a>

            <!-- ─── DOWNLOAD CARD 2 ─── -->
            <a href="https://cdn.discordapp.com/attachments/1455373172487622778/1542488527114338335/libRainyyClient.so?ex=6a9169e2&is=6a901862&hm=e31cf99e165f231e6dbe23d0e54069fc73ea8ca31459c5568a82243e17d67ee1&" download class="download-card">
                <span class="version">RainyyClient <span>2022.2</span></span>
                <span class="arrow">⬇</span>
                <div class="badge">latest</div>
                <div class="file-size">~ 145 MB</div>
            </a>
        </div>

        <div class="footer">✦ click a box to start the download ✦</div>
    </div>

    <!-- ─── Optional: if you want to track clicks, you can add JS ─── -->
    <script>
        // If you want to log which version was clicked, you can add:
        document.querySelectorAll('.download-card').forEach(card => {
            card.addEventListener('click', function(e) {
                // e.target is the card; you can read the version text
                const version = this.querySelector('.version')?.textContent?.trim() || 'unknown';
                console.log(`Download started: ${version}`);
                // No need to prevent default – the link will open
            });
        });
    </script>
</body>
</html>
