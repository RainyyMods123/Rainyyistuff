<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tutorial Events And Live Text Panel</title>
<style>
    * {
        box-sizing: border-box;
    }

    html {
        height: 100%;
    }

    body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, sans-serif;
        background:
            radial-gradient(circle at 50% 50%, #073cff 0%, #031a78 35%, #01082e 100%);
        background-attachment: fixed;
        color: white;
        text-align: center;
        padding-top: 80px;
        padding-bottom: 60px;
        overflow-y: auto;
        overflow-x: hidden;
        position: relative;
    }

    /* Repeated Tutorial background */
    body::before {
        content:
            "Tutorial     Tutorial     Tutorial     Tutorial     Tutorial";
        position: fixed;
        top: 0;
        left: -15%;
        width: 130%;
        height: 100%;

        font-size: 85px;
        font-weight: 900;
        font-style: italic;
        line-height: 1.8;
        letter-spacing: 4px;

        color: transparent;
        -webkit-text-stroke: 2px rgba(80, 160, 255, 0.12);

        transform: rotate(-8deg) scale(1.2);
        white-space: pre-wrap;

        pointer-events: none;
        z-index: 0;
    }

    /* Extra glow behind the panel */
    body::after {
        content: "";
        position: fixed;
        width: 600px;
        height: 600px;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        background: rgba(0, 90, 255, 0.25);
        filter: blur(100px);
        border-radius: 50%;
        pointer-events: none;
        z-index: 0;
    }

    /* RGB animated outline */
    .box {
        position: relative;
        width: 540px;
        max-width: calc(100% - 30px);
        margin: auto;
        padding: 35px;
        border-radius: 18px;

        z-index: 2;

        border: 3px solid transparent;
        background:
            linear-gradient(rgba(5, 10, 35, 0.95), rgba(5, 10, 35, 0.95)) padding-box,
            linear-gradient(
                90deg,
                #ff0000,
                #ff00ff,
                #0000ff,
                #00ffff,
                #00ff00,
                #ffff00,
                #ff0000
            ) border-box;

        background-size: 100% 100%, 400% 100%;

        animation: rgbBorder 4s linear infinite;

        box-shadow:
            0 0 15px rgba(0, 100, 255, 0.5),
            0 0 40px rgba(0, 100, 255, 0.25);
    }

    @keyframes rgbBorder {
        0% { background-position: 0 0, 0% 50%; }
        100% { background-position: 0 0, 400% 50%; }
    }

    /* Small Tutorial title */
    .title {
        position: relative;
        z-index: 2;

        margin-bottom: 25px;

        font-size: 28px;
        font-weight: 900;
        letter-spacing: 5px;

        background: linear-gradient(
            90deg,
            #ff0055,
            #ff00ff,
            #008cff,
            #00ffff,
            #00ff88,
            #ffff00
        );

        background-size: 300% 100%;

        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;

        animation: titleRGB 5s linear infinite;

        text-shadow: 0 0 20px rgba(0, 150, 255, 0.3);
    }

    @keyframes titleRGB {
        0% { background-position: 0% 50%; }
        100% { background-position: 300% 50%; }
    }

    input {
        width: 100%;
        padding: 14px;
        font-size: 16px;

        border-radius: 10px;
        border: 1px solid rgba(0, 150, 255, 0.5);

        outline: none;

        color: white;
        background: rgba(0, 20, 60, 0.8);

        transition: 0.25s;

        box-shadow: inset 0 0 15px rgba(0, 100, 255, 0.15);
    }

    input::placeholder {
        color: rgba(255, 255, 255, 0.45);
    }

    input:focus {
        border-color: #00aaff;
        box-shadow:
            0 0 10px rgba(0, 150, 255, 0.5),
            inset 0 0 15px rgba(0, 100, 255, 0.2);
    }

    .buttons {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin-top: 18px;
    }

    button {
        min-height: 48px;
        padding: 10px;
        border: none;
        border-radius: 10px;
        color: white;
        font-size: 14px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.25s;
        background-size: 200% 100%;
    }

    button:hover {
        transform: translateY(-2px) scale(1.04);
        background-position: 100% 0;
    }

    button:active {
        transform: scale(0.97);
    }

    button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none;
    }

    #messageButton {
        background: linear-gradient(90deg, #00c853, #00e676, #00c853);
        box-shadow: 0 0 15px rgba(0, 255, 100, 0.35);
    }
    #messageButton:hover {
        box-shadow:
            0 0 20px rgba(0, 255, 100, 0.7),
            0 0 40px rgba(0, 255, 100, 0.3);
    }

    #eventButton {
        background: linear-gradient(90deg, #1976d2, #2196f3, #1976d2);
        box-shadow: 0 0 15px rgba(0, 150, 255, 0.35);
    }
    #eventButton:hover {
        box-shadow:
            0 0 20px rgba(0, 150, 255, 0.7),
            0 0 40px rgba(0, 150, 255, 0.3);
    }

    #clearButton {
        background: linear-gradient(90deg, #d50000, #ff1744, #d50000);
        box-shadow: 0 0 15px rgba(255, 0, 60, 0.35);
    }
    #clearButton:hover {
        box-shadow:
            0 0 20px rgba(255, 0, 60, 0.7),
            0 0 40px rgba(255, 0, 60, 0.3);
    }

    #status {
        min-height: 18px;
        margin: 14px 0 0;
        font-size: 14px;
        color: rgba(255, 255, 255, 0.7);
    }

    .section {
        position: relative;
        width: 540px;
        max-width: calc(100% - 30px);
        margin: 20px auto 0;
        padding: 22px 25px;
        border-radius: 14px;
        text-align: left;

        background: rgba(5, 10, 35, 0.85);
        border: 1px solid rgba(0, 150, 255, 0.35);
        box-shadow: 0 0 15px rgba(0, 100, 255, 0.2);
        z-index: 2;
    }

    .section h2 {
        margin: 0 0 12px;
        font-size: 15px;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.75);
    }

    .quick-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .quick-list li button {
        width: 100%;
        text-align: left;
        min-height: 40px;
        font-size: 14px;
        border-radius: 8px;
    }

    .quick-list.events li button {
        background: linear-gradient(90deg, #1976d2, #2196f3, #1976d2);
        box-shadow: 0 0 10px rgba(0, 150, 255, 0.3);
    }

    .quick-list.messages li button {
        background: linear-gradient(90deg, #00c853, #00e676, #00c853);
        box-shadow: 0 0 10px rgba(0, 255, 100, 0.3);
    }

    .empty-hint {
        font-size: 13px;
        color: rgba(255, 255, 255, 0.4);
        font-style: italic;
    }
</style>
</head>

<body>

<div class="title">Tutorial</div>

<div class="box">
    <input
        id="textInput"
        type="text"
        placeholder="Type a message or GameObject path..."
        autocomplete="off"
    >

    <div class="buttons">
        <button id="messageButton" type="button" onclick="sendMessage()">Send Message</button>
        <button id="eventButton" type="button" onclick="sendEvent()">Send Event</button>
        <button id="clearButton" type="button" onclick="clearEverything()">Clear</button>
    </div>

    <p id="status" aria-live="polite"></p>
</div>

<div class="section">
    <h2>Quick Events</h2>
    <ul class="quick-list events" id="quickEvents"></ul>
</div>

<div class="section">
    <h2>Quick Messages</h2>
    <ul class="quick-list messages" id="quickMessages"></ul>
</div>

<script>
    const DB_URL = "tutorial(CHANGE THIS)/text.json";
    const EVENT_HEADER = "EVENT:";

    const textInput = document.getElementById("textInput");
    const statusText = document.getElementById("status");
    const messageButton = document.getElementById("messageButton");
    const eventButton = document.getElementById("eventButton");
    const clearButton = document.getElementById("clearButton");

    async function sendMessage() {
        const message = textInput.value.replace(/\\n/g, "\n");

        if (message.trim().length === 0) {
            statusText.innerText = "Enter a message first.";
            return;
        }

        const ok = await sendValue(message, "Message sent!");
        if (ok) textInput.value = "";
    }

    async function sendEvent() {
        const gameObjectPath = textInput.value.trim();

        if (gameObjectPath.length === 0) {
            statusText.innerText = "Enter a GameObject path first.";
            return;
        }

        const ok = await sendValue(EVENT_HEADER + gameObjectPath, "Event sent \u2714");
        if (ok) textInput.value = "";
    }

    async function clearEverything() {
        // Send an empty string instead of null so the value reads as
        // blank ("") rather than the text "null" on the receiving end.
        textInput.value = "";
        await sendValue("", "Cleared \u2714");
    }

    async function sendValue(value, successMessage) {
        setButtonsDisabled(true);
        statusText.innerText = "Sending...";

        try {
            const response = await fetch(DB_URL, {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(value)
            });

            if (!response.ok) {
                throw new Error("HTTP " + response.status);
            }

            statusText.innerText = successMessage;
            return true;
        }
        catch (error) {
            statusText.innerText = "Error \u274c";
            console.error("Could not update the live value:", error);
            return false;
        }
        finally {
            setButtonsDisabled(false);
        }
    }

    function setButtonsDisabled(disabled) {
        messageButton.disabled = disabled;
        eventButton.disabled = disabled;
        clearButton.disabled = disabled;
    }

    // Allow pressing Enter to send the message
    textInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
            sendMessage();
        }
    });

    // --- Quick Events / Quick Messages lists ---
    // Add or remove entries here to change what shows up in each list.
    const QUICK_EVENTS = [];
    const QUICK_MESSAGES = [];

    async function sendQuickEvent(label) {
        await sendValue(EVENT_HEADER + label, "Event sent \u2714");
    }

    async function sendQuickMessage(label) {
        await sendValue(label, "Message sent!");
    }

    function buildQuickList(containerId, items, onClick, emptyText) {
        const list = document.getElementById(containerId);
        list.innerHTML = "";

        if (items.length === 0) {
            const li = document.createElement("li");
            li.className = "empty-hint";
            li.textContent = emptyText;
            list.appendChild(li);
            return;
        }

        items.forEach((label) => {
            const li = document.createElement("li");
            const btn = document.createElement("button");
            btn.type = "button";
            btn.textContent = label;
            btn.onclick = () => onClick(label);
            li.appendChild(btn);
            list.appendChild(li);
        });
    }

    buildQuickList("quickEvents", QUICK_EVENTS, sendQuickEvent, "No quick events yet.");
    buildQuickList("quickMessages", QUICK_MESSAGES, sendQuickMessage, "No quick messages yet.");
</script>

</body>
</html>
