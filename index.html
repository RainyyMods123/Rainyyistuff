<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Owners for Rainyy TAGG</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(145deg, #0d0d0d 0%, #1a1a1a 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .main-container {
      max-width: 900px;
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(6px);
      border-radius: 3rem;
      padding: 3rem 2.5rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.06);
      text-align: center;
    }

    /* ----- TOP BIG HEADING ----- */
    .top-heading {
      font-size: clamp(2.2rem, 8vw, 4.5rem);
      font-weight: 900;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      background: linear-gradient(135deg, #ff2d55, #ff6b8a, #ffb3c6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: 0 0 30px rgba(255, 45, 85, 0.3);
      margin-bottom: 2.5rem;
      line-height: 1.2;
    }
    .top-heading span {
      display: inline-block;
    }

    /* ----- MIDDLE PLACEHOLDER (Rainyy + TR4GIC) ----- */
    .names-wrapper {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 1.5rem 3rem;
      margin: 2.5rem 0 3rem 0;
    }

    .name-card {
      background: rgba(255, 255, 255, 0.04);
      padding: 1.2rem 2.8rem;
      border-radius: 100px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
      transition: transform 0.2s ease;
    }
    .name-card:hover {
      transform: scale(1.03);
      border-color: rgba(255, 45, 85, 0.4);
    }

    .name-card h2 {
      font-size: clamp(2rem, 5vw, 3.8rem);
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.04em;
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
    }

    .name-card.rainyy h2 {
      color: #ff6b8a;
      text-shadow: 0 0 30px rgba(255, 107, 138, 0.4);
    }
    .name-card.tr4gic h2 {
      color: #7a9eff;
      text-shadow: 0 0 30px rgba(122, 158, 255, 0.4);
    }

    /* ----- TIKTOK BUTTONS ----- */
    .tiktok-section {
      margin-top: 1rem;
    }

    .tiktok-section p {
      color: rgba(255, 255, 255, 0.6);
      font-size: 1.1rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 1.5rem;
    }

    .btn-group {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1.2rem;
    }

    .tiktok-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      background: #000;
      color: #fff;
      padding: 0.9rem 2.2rem;
      border-radius: 60px;
      font-size: 1.2rem;
      font-weight: 600;
      text-decoration: none;
      border: 2px solid rgba(255, 255, 255, 0.15);
      transition: all 0.25s ease;
      box-shadow: 0 8px 0 #1a1a1a;
    }

    .tiktok-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 0 #1a1a1a, 0 0 25px rgba(255, 45, 85, 0.3);
      border-color: #ff2d55;
    }

    .tiktok-btn .icon {
      font-size: 1.6rem;
    }

    /* small note */
    .footer-note {
      margin-top: 2.5rem;
      color: rgba(255, 255, 255, 0.2);
      font-size: 0.8rem;
      letter-spacing: 0.05em;
    }

    /* responsive tweaks */
    @media (max-width: 500px) {
      .main-container {
        padding: 2rem 1.2rem;
      }
      .name-card {
        padding: 0.8rem 1.8rem;
      }
      .tiktok-btn {
        padding: 0.7rem 1.6rem;
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="main-container">

    <!-- TOP: BIG LETTERS -->
    <h1 class="top-heading">
      OWNERS FOR RAINYY TAGG<br />
      <span style="font-size:0.45em; -webkit-text-fill-color: rgba(255,255,255,0.2); background: none; text-shadow: none;">
        (with tiktok links)
      </span>
    </h1>

    <!-- MIDDLE: Rainyy + TR4GIC placeholder -->
    <div class="names-wrapper">
      <div class="name-card rainyy">
        <h2>🌧️ Rainyy</h2>
      </div>
      <div class="name-card tr4gic">
        <h2>⚡ TR4GIC</h2>
      </div>
    </div>

    <!-- TIKTOK LINKS -->
    <div class="tiktok-section">
      <p>👇 Go to TikTok 👇</p>
      <div class="btn-group">
        <!-- Replace the href="#" with your actual TikTok URL -->
        <a href="https://tiktok.com/@billyyates09" class="tiktok-btn" target="_blank">
          <span class="icon">🎵</span> Rainyy's TikTok
        </a>
        <!-- Replace the href="#" with TR4GIC's actual TikTok URL -->
        <a href="https://www.tiktok.com/@tragic.on.90hz" class="tiktok-btn" target="_blank">
          <span class="icon">🎵</span> TR4GIC's TikTok
        </a>
      </div>
    </div>

    <div class="footer-note">
      This was made by Rainyy
    </div>
  </div>
</body>
</html>
