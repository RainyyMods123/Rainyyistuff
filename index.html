<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Will you date me? 💕</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(145deg, #f9b8d4 0%, #ffdde1 100%);
            padding: 1rem;
            user-select: none;
            overflow: hidden;
            position: relative;
        }

        .container {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(6px);
            padding: 3rem 4rem;
            border-radius: 60px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            text-align: center;
            max-width: 600px;
            width: 100%;
            transition: all 0.3s ease;
            position: relative;
        }

        h1 {
            font-size: 3.2rem;
            font-weight: 700;
            color: #a02c5a;
            letter-spacing: 1px;
            margin-bottom: 2rem;
            text-shadow: 0 4px 12px rgba(160, 44, 90, 0.15);
        }

        .buttons {
            display: flex;
            gap: 2rem;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }

        .btn {
            border: none;
            padding: 1rem 2.5rem;
            font-size: 1.6rem;
            font-weight: 700;
            border-radius: 60px;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.2s;
            letter-spacing: 1px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
        }

        .btn-yes {
            background: #4caf50;
            color: #fff;
        }
        .btn-yes:hover {
            transform: scale(1.06);
            box-shadow: 0 12px 30px rgba(76, 175, 80, 0.35);
        }

        .btn-no {
            background: #e74c3c;
            color: #fff;
            position: relative;
            transition: left 0.15s ease, top 0.15s ease;
            /* will be moved via JS */;
        }
        .btn-no:hover {
            /* we will override with JS repositioning */
        }

        /* Result screen (hidden initially) */
        .result {
            display: none;
            animation: fadeIn 0.6s ease;
        }
        .result.active {
            display: block;
        }

        .result h2 {
            font-size: 3rem;
            color: #a02c5a;
            margin-bottom: 0.5rem;
        }
        .result p {
            font-size: 1.5rem;
            color: #444;
            margin-top: 1rem;
            line-height: 1.5;
        }
        .result .wet-concrete {
            font-style: italic;
            background: rgba(0, 0, 0, 0.04);
            padding: 0.5rem 1rem;
            border-radius: 40px;
            display: inline-block;
            margin-top: 0.5rem;
        }

        /* Confetti emoji sprinkles */
        .sparkle {
            position: fixed;
            font-size: 2rem;
            pointer-events: none;
            animation: floatUp 2s ease-out forwards;
            z-index: 999;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-200px) scale(0.3); }
        }

        @keyframes fadeIn {
            0% { opacity: 0; transform: scale(0.95); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* Responsive */
        @media (max-width: 500px) {
            .container {
                padding: 2rem 1.5rem;
            }
            h1 {
                font-size: 2.4rem;
            }
            .btn {
                font-size: 1.2rem;
                padding: 0.8rem 1.8rem;
            }
            .buttons {
                gap: 1.2rem;
            }
            .result h2 {
                font-size: 2.2rem;
            }
            .result p {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>

    <div class="container" id="mainContainer">
        <!-- Main question -->
        <div id="questionArea">
            <h1>💕 Will you date me?</h1>
            <div class="buttons">
                <button class="btn btn-yes" id="yesBtn">Yes</button>
                <button class="btn btn-no" id="noBtn">No</button>
            </div>
        </div>

        <!-- Result area (hidden) -->
        <div class="result" id="resultArea">
            <h2>Wait you said yes? 🥺</h2>
            <p>
                You understand I look like <span class="wet-concrete">wet concrete</span> right?
            </p>
            <div style="margin-top: 2rem; font-size: 3rem;">💀💕</div>
        </div>
    </div>

    <script>
        (function() {
            const yesBtn = document.getElementById('yesBtn');
            const noBtn = document.getElementById('noBtn');
            const questionArea = document.getElementById('questionArea');
            const resultArea = document.getElementById('resultArea');
            const container = document.getElementById('mainContainer');

            // ─── "No" button flee logic ───
            // We track mouse position globally to know where the cursor is.
            let mouseX = 0, mouseY = 0;

            document.addEventListener('mousemove', function(e) {
                mouseX = e.clientX;
                mouseY = e.clientY;
            });

            function moveNoButtonAway() {
                // Get container bounds (to keep button inside viewport roughly)
                const rect = container.getBoundingClientRect();
                const btnRect = noBtn.getBoundingClientRect();

                // We want to place the button somewhere in the viewport, but not under the cursor.
                // We'll pick a random position within the viewport, but we'll check if it overlaps the cursor.
                // To keep it simple, we move it to a random spot with a margin.
                const margin = 80;
                const viewportW = window.innerWidth;
                const viewportH = window.innerHeight;

                // We'll try up to 20 times to find a spot far from the cursor.
                let placed = false;
                let attempts = 0;
                const btnW = btnRect.width || 100;  // fallback if rect not ready
                const btnH = btnRect.height || 50;

                while (!placed && attempts < 30) {
                    attempts++;
                    // Random position within viewport, keeping button fully visible.
                    let left = Math.random() * (viewportW - btnW - margin * 2) + margin;
                    let top = Math.random() * (viewportH - btnH - margin * 2) + margin;

                    // Calculate distance from cursor (center of button roughly)
                    const btnCenterX = left + btnW / 2;
                    const btnCenterY = top + btnH / 2;
                    const dx = btnCenterX - mouseX;
                    const dy = btnCenterY - mouseY;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    // If distance is greater than 150px, we place it there.
                    if (dist > 150) {
                        noBtn.style.position = 'fixed';
                        noBtn.style.left = left + 'px';
                        noBtn.style.top = top + 'px';
                        noBtn.style.transform = 'none'; // remove any transform scaling
                        placed = true;
                    }
                }

                // If we couldn't find a good spot, just move it to a random corner.
                if (!placed) {
                    const left = Math.random() * (viewportW - btnW - 40) + 20;
                    const top = Math.random() * (viewportH - btnH - 40) + 20;
                    noBtn.style.position = 'fixed';
                    noBtn.style.left = left + 'px';
                    noBtn.style.top = top + 'px';
                }
            }

            // When the user hovers the "No" button, we move it.
            noBtn.addEventListener('mouseover', function(e) {
                moveNoButtonAway();
            });

            // Also move away if the button is touched on mobile (touchstart) – optional.
            noBtn.addEventListener('touchstart', function(e) {
                e.preventDefault(); // prevent default touch behavior
                moveNoButtonAway();
            });

            // ─── "Yes" button: show result ───
            yesBtn.addEventListener('click', function() {
                // Hide question, show result
                questionArea.style.display = 'none';
                resultArea.classList.add('active');

                // Sprinkle some emoji love
                for (let i = 0; i < 20; i++) {
                    setTimeout(() => {
                        createSparkle();
                    }, i * 80);
                }
            });

            // ─── Sparkle effect ───
            function createSparkle() {
                const emojis = ['💖', '💕', '✨', '💗', '🌸', '🎉', '💘', '💝'];
                const el = document.createElement('div');
                el.className = 'sparkle';
                el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                el.style.left = (Math.random() * 100) + 'vw';
                el.style.top = (Math.random() * 100) + 'vh';
                el.style.fontSize = (1.5 + Math.random() * 2.5) + 'rem';
                document.body.appendChild(el);
                // Remove after animation
                setTimeout(() => el.remove(), 2200);
            }

            // ─── Initial placement of "No" button (avoid cursor on load) ───
            // We'll just set a fixed position away from the center.
            setTimeout(() => {
                // Place it somewhere to the right/bottom.
                const vw = window.innerWidth;
                const vh = window.innerHeight;
                // but we want it inside the container originally, so we don't override the flex layout unless moved.
                // Actually we want it to stay in the flex layout until the first hover.
                // We'll just keep it in flow. The mouseover will reposition it fixed.
                // But if we want it to start in a safe place, we can add a slight offset.
                // But it's fine.
            }, 100);
        })();
    </script>

</body>
</html>
